<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a221c">
  <title>skadoge</title>
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="player-shell">
    <div id="game-frame">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
      <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-panel">
      <h1 class="loading-title">skadoge</h1>
      <p class="loading-subtitle">Loading game...</p>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-label" class="progress-label">0%</p>
    </div>
  </div>

  <div id="rotate-overlay" aria-hidden="true">
    <div class="rotate-icon" aria-hidden="true"></div>
    <h2 class="rotate-title">Rotate your device</h2>
    <p class="rotate-copy">skadoge plays in landscape. Turn your phone sideways to continue.</p>
  </div>

  <script src="Build/skadoge-game.loader.js"></script>
  <script>
    (function () {
      var GAME_ASPECT = 16 / 9;
      var canvas = document.querySelector("#unity-canvas");
      var gameFrame = document.querySelector("#game-frame");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var progressFill = document.querySelector("#progress-fill");
      var progressLabel = document.querySelector("#progress-label");
      var progressBar = document.querySelector(".progress-track");
      var rotateOverlay = document.querySelector("#rotate-overlay");
      var fullscreenButton = document.querySelector("#fullscreen-button");
      var unityInstance = null;

      var isMobileLike =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        window.matchMedia("(pointer: coarse)").matches;

      function getViewportSize() {
        var safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-top")) || 0;
        var safeRight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-right")) || 0;
        var safeBottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-bottom")) || 0;
        var safeLeft = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-left")) || 0;

        return {
          width: Math.max(window.innerWidth - safeLeft - safeRight, 0),
          height: Math.max(window.innerHeight - safeTop - safeBottom, 0)
        };
      }

      function fitGameFrame() {
        var viewport = getViewportSize();
        var width = viewport.width;
        var height = viewport.height;

        if (width / height > GAME_ASPECT) {
          height = viewport.height;
          width = height * GAME_ASPECT;
        } else {
          width = viewport.width;
          height = width / GAME_ASPECT;
        }

        gameFrame.style.width = width + "px";
        gameFrame.style.height = height + "px";
      }

      function isPortraitMobile() {
        if (!isMobileLike) {
          return false;
        }

        return window.matchMedia("(orientation: portrait)").matches;
      }

      function updateOrientationGate() {
        var portrait = isPortraitMobile();

        document.body.classList.toggle("is-rotate-locked", portrait);
        rotateOverlay.classList.toggle("is-visible", portrait);
        rotateOverlay.setAttribute("aria-hidden", portrait ? "false" : "true");
      }

      function setProgress(value) {
        var percent = Math.round(Math.min(Math.max(value, 0), 1) * 100);
        progressFill.style.width = percent + "%";
        progressLabel.textContent = percent + "%";
        progressBar.setAttribute("aria-valuenow", String(percent));
      }

      function hideLoadingOverlay() {
        loadingOverlay.classList.add("is-hidden");
        loadingOverlay.setAttribute("aria-busy", "false");
      }

      function focusCanvas() {
        window.requestAnimationFrame(function () {
          canvas.focus({ preventScroll: true });
        });
      }

      function showFullscreenButton() {
        if (!document.fullscreenEnabled) {
          return;
        }

        fullscreenButton.classList.add("is-visible");
      }

      fitGameFrame();
      updateOrientationGate();

      window.addEventListener("resize", function () {
        fitGameFrame();
        updateOrientationGate();
      });

      window.addEventListener("orientationchange", function () {
        window.setTimeout(function () {
          fitGameFrame();
          updateOrientationGate();
        }, 150);
      });

      window.matchMedia("(orientation: portrait)").addEventListener("change", updateOrientationGate);

      fullscreenButton.addEventListener("click", function () {
        if (!unityInstance) {
          return;
        }

        unityInstance.SetFullscreen(1);
      });

      document.addEventListener("fullscreenchange", function () {
        window.setTimeout(fitGameFrame, 50);
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/skadoge-game.data.unityweb",
        frameworkUrl: "Build/skadoge-game.framework.js.unityweb",
        codeUrl: "Build/skadoge-game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "skadoge",
        productVersion: "1.0",
        fullscreen: true
      }, setProgress).then(function (instance) {
        unityInstance = instance;
        setProgress(1);
        hideLoadingOverlay();
        showFullscreenButton();
        focusCanvas();
      }).catch(function (message) {
        progressLabel.textContent = "Failed to load game.";
        alert(message);
      });
    })();
  </script>
</body>

</html>
